name: Build DocDrop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and zip
        run: npm run package

      - name: Keep the zip for download
        uses: actions/upload-artifact@v4
        with:
          name: docdrop-extension
          path: docdrop-v*.zip

      - name: Publish a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: docdrop-v*.zip
          generate_release_notes: true
