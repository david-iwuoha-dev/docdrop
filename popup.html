<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>DocDrop</h1>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="track" aria-hidden="true"></span>
      <span class="sr">Turn DocDrop on or off</span>
    </label>
  </header>
  <p id="status">DocDrop is off.</p>
  <button id="openTab" type="button">Open the drop tab</button>
  <p class="hint">Drag a file from the downloads list onto the drop tab. New downloads open by themselves while DocDrop is on.</p>
  <script src="popup.js"></script>
</body>
</html>
